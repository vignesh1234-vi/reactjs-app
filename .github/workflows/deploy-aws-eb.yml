
name: Deploy React App to AWS Elastic Beanstalk

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EB_APPLICATION_NAME: "EBS - Application"
  EB_ENVIRONMENT_NAME: "EBS-Application-env"

jobs:
  deploy:
    name: Build and Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React application
        run: npm run build

      # 5. Package application
      - name: Package application
        run: |
          zip -r "$RUNNER_TEMP/deployment.zip" \
            build server.js package.json package-lock.json

      # 6. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. Verify AWS account
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 8. Verify Elastic Beanstalk application and environment
      - name: Verify Elastic Beanstalk resources
        run: |
          echo "Available Elastic Beanstalk applications:"
          aws elasticbeanstalk describe-applications \
            --region "$AWS_REGION" \
            --query "Applications[].ApplicationName" \
            --output table

          echo "Checking application: $EB_APPLICATION_NAME"

          aws elasticbeanstalk describe-applications \
            --application-names "$EB_APPLICATION_NAME" \
            --region "$AWS_REGION"

          echo "Checking environment: $EB_ENVIRONMENT_NAME"

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION"

      # 9. Upload deployment package to S3
      - name: Upload deployment package to S3
        env:
          S3_ARN: ${{ vars.S3_ARN }}
        run: |
          S3_BUCKET="${S3_ARN#arn:aws:s3:::}"
          S3_KEY="deployments/react-app-${GITHUB_SHA}.zip"

          echo "S3_BUCKET=$S3_BUCKET" >> "$GITHUB_ENV"
          echo "S3_KEY=$S3_KEY" >> "$GITHUB_ENV"

          aws s3 cp "$RUNNER_TEMP/deployment.zip" \
            "s3://$S3_BUCKET/$S3_KEY" \
            --region "$AWS_REGION"

      # 10. Create Elastic Beanstalk application version
      - name: Create Elastic Beanstalk application version
        run: |
          VERSION_LABEL="github-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle \
              S3Bucket="$S3_BUCKET",S3Key="$S3_KEY" \
            --region "$AWS_REGION"

      # 11. Deploy application to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL" \
            --region "$AWS_REGION"

      # 12. Wait for deployment completion
      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION"

      # 13. Display deployment status
      - name: Deployment status
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION" \
            --query "Environments[].{Application:ApplicationName,Environment:EnvironmentName,Status:Status,Health:Health,Version:VersionLabel}" \
            --output table
